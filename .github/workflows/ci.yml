name: CI

on:
  push:
    branches: ["**"]

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vigil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://vigil:password@localhost:5432/vigil_test
      SERVER_PORT: 8080
      RUST_LOG: error
      GITHUB_CLIENT_ID: test_client_id
      GITHUB_CLIENT_SECRET: test_client_secret
      GITHUB_REDIRECT_URI: http://localhost:8080/github/callback
      TOKEN_ENCRYPTION_KEY: test-encryption-key
      KICKOFF_TOKEN: test-kickoff-token
      IS_MERGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli,cargo-llvm-cov

      - name: Migrate
        run: cargo sqlx migrate run

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Full build
        if: env.IS_MERGE == 'true'
        run: cargo build --release

      - name: Integration tests
        if: env.IS_MERGE == 'true'
        run: cargo test

      - name: Coverage
        if: env.IS_MERGE == 'true'
        run: cargo llvm-cov --html

      - name: Upload coverage report
        if: env.IS_MERGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/target/llvm-cov/html

  client_web:
    name: Web client (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client_web

    env:
      IS_MERGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm format:check
          pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Full build
        if: env.IS_MERGE == 'true'
        run: pnpm build

      - name: Integration tests
        if: env.IS_MERGE == 'true'
        run: pnpm test:integration

      - name: Coverage
        if: env.IS_MERGE == 'true'
        run: pnpm test:coverage

      - name: Upload coverage report
        if: env.IS_MERGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-web-coverage
          path: client_web/coverage/lcov-report
