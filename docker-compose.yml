services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vigil
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgres://vigil:password@db:5432/vigil
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  client_desktop:
    build: ./client_desktop
    volumes:
      - desktop_binary:/shared

  client_web:
    build: ./client_web
    restart: unless-stopped
    environment:
      DESKTOP_BINARY_PATH: /shared/client.dmg
    ports:
      - "8081:8081"
    volumes:
      - desktop_binary:/shared
    depends_on:
      server:
        condition: service_started
      client_desktop:
        condition: service_completed_successfully

volumes:
  db_data:
  desktop_binary:
